services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data

  edge-ai:
    build: ./edge-ai
    container_name: edge-ai-diagnostics
    restart: always
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=202345021
      - MQTT_PASS=1234
    depends_on:
      - mosquitto

  tb-gateway:
    depends_on:
      - mosquitto
      - edge-ai

volumes:
  mosquitto-data:
