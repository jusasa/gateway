name: rep8-tb
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: always
    ports: ["1883:1883"]
    environment:
      MON_PASS: ${MQTT_PASS:?.env에 MQTT_PASS가 없습니다}
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -u 202345021 -P \"$$MON_PASS\" -t 'raw/healthcheck/sensor' -m 'ok'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
    logging: *logging
    networks: [iot-net]

  edge-ai:
    build: ./edge-ai
    image: rep8-gateway-extractor:latest
    container_name: gateway-feature-extractor
    restart: always
    environment:
      MQTT_BROKER: mosquitto
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: 202345021
      MQTT_PASS: ${MQTT_PASS:?.env에 MQTT_PASS가 없습니다}
      FAN_SPEED: ${FAN_SPEED:-2}
      BLADE_COUNT: ${BLADE_COUNT:-5}
      DATA_DIR: /data
    volumes:
      - ./edge-ai/data:/data
    depends_on:
      mosquitto: { condition: service_healthy }
    logging: *logging
    networks: [iot-net]

  alarm-server:
    build: ./edge-ai
    image: rep8-gateway-extractor:latest
    container_name: gateway-alarm-server
    restart: always
    command: ["python", "-u", "alarm_server.py"]
    ports:
      - "50051:50051"
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: 202345021
      MQTT_PASS: ${MQTT_PASS:?.env에 MQTT_PASS가 없습니다}
      BUZZER_PIN: 18
      GRPC_PORT: 50051
    depends_on:
      mosquitto: { condition: service_healthy }
    logging: *logging
    networks: [iot-net]

  tb-gateway:
    image: thingsboard/tb-gateway:3.8-stable
    container_name: tb-gateway
    restart: always
    environment:
      TB_GW_HOST: ${TB_GW_HOST:-thingsboard.codebridge.ai.kr}
      TB_GW_PORT: "1883"
      TB_GW_ACCESS_TOKEN: ${TB_GW_ACCESS_TOKEN:?.env에 TB_GW_ACCESS_TOKEN이 없습니다}
    volumes:
      - tb-gw-config:/thingsboard_gateway/config
      - tb-gw-logs:/thingsboard_gateway/logs
      - tb-gw-extensions:/thingsboard_gateway/extensions
    depends_on:
      mosquitto: { condition: service_healthy }
      edge-ai: { condition: service_started }
    logging: *logging
    networks: [iot-net]

networks:
  iot-net: { driver: bridge }

volumes:
  mosquitto-data:
  tb-gw-config:
  tb-gw-logs:
  tb-gw-extensions:
